services:
  nginx:
    restart: always
    build:
      context: ./nginx
    ports:
      - '3050:80'
  postgres:
    image: 'postgres:17'
    environment:
      - POSTGRES_PASSWORD=postgres_password
  redis:
    image: 'redis:7'
  api:
    depends_on:
      - postgres
      - redis
    build:
      context: ./api
    volumes:
      - /app/node_modules
      - ./api:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PG_USER=postgres
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=postgres
      - PG_PASSWORD=postgres_password
  client:
    build:
      context: ./client
    volumes:
      - /app/node_modules
      - ./client:/app
  worker:
    depends_on:
      - redis
    build:
      context: ./worker
    volumes:
      - /app/node_modules
      - ./worker:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
